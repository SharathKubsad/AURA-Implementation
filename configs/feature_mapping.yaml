    cic_malmem_2022: { field: "malfind.commitCharge", type: "APPROXIMATED", confidence: "MEDIUM" }
    cape_sandbox: { field: null, type: "UNAVAILABLE", confidence: "LOW" }
  injected_code_regions:
    cic_malmem_2022: { field: "malfind.ninjections", type: "DIRECT", confidence: "HIGH" }
    cape_sandbox: { field: "behavior.summary.injected_mem", type: "DIRECT", confidence: "HIGH" }
  unmapped_executable_pages:
    cic_malmem_2022: { field: "malfind.uniqueInjections", type: "APPROXIMATED", confidence: "MEDIUM" }
    cape_sandbox: { field: null, type: "UNAVAILABLE", confidence: "LOW" }
  vad_protection_anomaly_count:
    cic_malmem_2022: { field: "malfind.protection", type: "DIRECT", confidence: "HIGH" }
    cape_sandbox: { field: null, type: "UNAVAILABLE", confidence: "LOW" }
  ldrmodules_inconsistencies:
    cic_malmem_2022: { field: "ldrmodules.not_in_mem", type: "DIRECT", confidence: "HIGH" }
    cape_sandbox: { field: null, type: "UNAVAILABLE", confidence: "LOW" }
  memory_injection_score:
    cic_malmem_2022: { formula: "2.0*rwx + 3.0*inj + 1.5*vad", type: "DERIVED", confidence: "HIGH" }
    cape_sandbox: { field: null, type: "UNAVAILABLE", confidence: "LOW" }
