[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fileless-malware-detector"
version = "0.1.0"
description = "Real-time AI-based Fileless Malware Detection and Classification System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Track A - Core Detection Engine" },
    { name = "Track B - Modeling, Language Signals & Assurance" }
]
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.11.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "catboost>=1.2.0",
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "shap>=0.43.0",
    "lime>=0.2.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.6",
    "scapy>=2.5.0",
    "pyshark>=0.6",
    "mlflow>=2.8.0",
    "dvc>=3.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "types-PyYAML>=6.0.12",
    "types-psutil>=5.9.5",
]

# ------------------------------------------------------------------------------
# Black Formatter Configuration
# ------------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # The following are specific to Black, you probably don't want those.
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data/raw
)/
'''

# ------------------------------------------------------------------------------
# Ruff Linter Configuration
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # Line length handled by black
    "B008", # Do not perform function calls in argument defaults (FastAPI Depends)
    "UP042", # StrEnum recommendation for (str, Enum)
]

[tool.ruff.lint.isort]
known-first-party = ["framework", "forensics", "preprocessing", "models", "evaluation"]

# ------------------------------------------------------------------------------
# Pytest Configuration
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ------------------------------------------------------------------------------
# Mypy Type Checking Configuration
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "scapy.*",
    "pyshark.*",
    "catboost.*",
    "lightgbm.*",
    "xgboost.*",
    "shap.*",
    "lime.*",
    "sklearn.*",
    "imblearn.*",
    "transformers.*",
    "torch.*",
    "volatility3.*",
]
ignore_missing_imports = true
